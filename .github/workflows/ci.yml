name: Cortado checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two macOS jobs split the jq variants. The Homebrew job runs every
        # suite plus the ShellCheck comparison and the timing steps; the Apple
        # job runs only the suites in tests/jq-suites.txt with /usr/bin/jq.
        include:
          - name: macOS (Bash 3.2, Homebrew jq)
            runner: macos-26
            jq: path
          - name: macOS (Bash 3.2, Apple jq)
            runner: macos-26
            jq: apple
          - name: Ubuntu
            runner: ubuntu-24.04
            jq: path
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          if [ ! -x "$(brew --prefix jq)/bin/jq" ]; then brew install jq; fi
          if ! command -v bc >/dev/null; then brew install bc; fi
          if ! command -v shellcheck >/dev/null; then brew install shellcheck; fi
          test -x /usr/bin/jq
          printf '%s\n' "$(brew --prefix jq)/bin" >> "$GITHUB_PATH"

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          missing=()
          for tool in jq bc; do
            if ! command -v "$tool" >/dev/null; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Identify tools
        id: tools
        run: |
          /bin/bash --version
          jq --version
          command -v bc
          if [ "$RUNNER_OS" = macOS ]; then
            /bin/bash -c '[[ $BASH_VERSION == 3.2.* ]]'
            /usr/bin/jq --version
            shellcheck --version | sed -n 2p
          fi

      - name: Check shell syntax
        run: |
          failed=0
          for script in cortado.sh install.sh lib/*.sh modules/*.sh tests/*.sh tests/lib/*.sh; do
            /bin/bash -n "$script" || { printf 'SYNTAX: %s\n' "$script"; failed=1; }
          done
          exit "$failed"

      # One job, one ShellCheck version: Homebrew's, the same one a developer Mac
      # runs for the Pre-PR check. Lint results don't depend on the OS, and
      # Ubuntu's packaged ShellCheck is older: it reports indirectly called
      # functions (stubs, traps) as SC2317 and ignores the SC2329 disables, so
      # comparing counts there failed PRs that were clean everywhere else.
      - name: Compare ShellCheck findings with the merge base
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && runner.os == 'macOS' && matrix.jq == 'path' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=HEAD^; fi
          merge_base=$(git merge-base HEAD "$BASE_SHA")
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/base"
          git archive "$merge_base" | tar -x -C "$scratch/base"
          sc() (
            cd "$1" || exit 1
            shopt -s nullglob
            local_status=0
            shellcheck -f json cortado.sh install.sh lib/*.sh modules/*.sh tests/*.sh tests/lib/*.sh > "$2" || local_status=$?
            if [ "$local_status" -gt 1 ]; then
              cat "$2" >&2
              exit "$local_status"
            fi
            jq -es 'if length == 1 and (.[0] | type == "array") then .[0] | length else error("Expected one ShellCheck diagnostics array") end' "$2" || {
              local_status=$?
              cat "$2" >&2
              exit "$local_status"
            }
          )
          base_count=$(sc "$scratch/base" "$scratch/base.json")
          head_count=$(sc . "$scratch/head.json")
          printf 'shellcheck findings: base %s, head %s\n' "$base_count" "$head_count"
          if [ "$head_count" -gt "$base_count" ]; then
            cat "$scratch/head.json"
            exit 1
          fi

      # The timing steps run before the suites, so they time a quiet runner
      # rather than one still busy with the parallel suites' leftovers.
      # The Ubuntu job enforces the default-render p95 limit of 200 ms. Its p95
      # measured 66-130 ms across 35 runs, and 152 ms (p50 122 ms) on a slower
      # runner host in run 45824276777, so 150 ms tripped on host speed alone. The macOS runner swings
      # between about 134 and 462 ms on the same code, so its jobs print p50
      # and p95 for information only. Listing ci:render-p95 in tests/flaky.txt
      # quarantines the Ubuntu gate: p50 and p95 are still measured and
      # printed, but the limit is not enforced.
      - name: Record default render p50 and p95
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && matrix.jq != 'apple' }}
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          CORTADO_RENDER_P95_LIMIT_MS: ${{ runner.os == 'Linux' && '200' || '0' }}
        run: |
          if awk '$1 == "ci:render-p95" { found = 1 } END { exit !found }' tests/flaky.txt; then
            printf '%s\n' "::notice::ci:render-p95 is quarantined in tests/flaky.txt; p95 is reported, not enforced (limit ${CORTADO_RENDER_P95_LIMIT_MS} ms)"
            export CORTADO_RENDER_P95_LIMIT_MS=0
          fi
          /bin/bash tests/render_timing.sh 60

      - name: Record warm all-modules render p50 and p95
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && matrix.jq != 'apple' }}
        continue-on-error: true
        run: /bin/bash tests/all_modules_timing.sh

      - name: Run the suites with macOS system Bash and ${{ matrix.jq == 'apple' && 'Apple' || 'Homebrew' }} jq
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && runner.os == 'macOS' }}
        env:
          JQ_VARIANT: ${{ matrix.jq }}
        run: /bin/bash tests/run-jq-variants.sh --variant "$JQ_VARIANT"

      - name: Run all suites
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && runner.os != 'macOS' }}
        run: /bin/bash tests/run-suites.sh
